<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Engineering Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 16px 24px;
    border-bottom: 1px solid #2a2d35;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    color: #fff;
  }

  .project-select {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .project-select label {
    font-size: 13px;
    color: #888;
  }

  .project-select select {
    background: #1a1d27;
    color: #e0e0e0;
    border: 1px solid #2a2d35;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }

  .project-select select:focus {
    outline: none;
    border-color: #5b8def;
  }

  #chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    max-width: 80%;
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.user {
    align-self: flex-end;
    background: #2563eb;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.assistant {
    align-self: flex-start;
    background: #1e2130;
    border: 1px solid #2a2d35;
    border-bottom-left-radius: 4px;
  }

  .message .sources {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #2a2d35;
    font-size: 12px;
    color: #888;
  }

  .message .node-trace {
    margin-top: 4px;
    font-size: 11px;
    color: #555;
    font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
  }

  .message .validation-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
  }

  .validation-badge.valid {
    background: #16382d;
    color: #4ade80;
  }

  .validation-badge.revalidated {
    background: #382d16;
    color: #facc15;
  }

  .validation-badge.unverified {
    background: #38161d;
    color: #f87171;
  }

  .validation-badge.validating {
    background: #1a2040;
    color: #60a5fa;
  }

  .typing-indicator {
    display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  #input-area {
    padding: 16px 24px;
    border-top: 1px solid #2a2d35;
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }

  #message-input {
    flex: 1;
    background: #1a1d27;
    color: #e0e0e0;
    border: 1px solid #2a2d35;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 44px;
    max-height: 120px;
  }

  #message-input:focus {
    outline: none;
    border-color: #5b8def;
  }

  #message-input::placeholder { color: #555; }

  #send-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }

  #send-btn:hover { background: #1d4ed8; }
  #send-btn:disabled { background: #1e3a6e; cursor: not-allowed; opacity: 0.6; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #555;
    gap: 8px;
  }

  .empty-state h2 { font-size: 20px; color: #888; font-weight: 500; }
  .empty-state p { font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>AI Engineering Assistant</h1>
  <div class="project-select">
    <label for="project">Project:</label>
    <select id="project">
      <option value="">None (plain chat)</option>
    </select>
  </div>
</header>

<div id="chat-area">
  <div class="empty-state">
    <h2>Ask a question</h2>
    <p>Select a project for RAG-powered answers, or chat without one.</p>
  </div>
</div>

<div id="input-area">
  <textarea id="message-input" placeholder="Type your message..." rows="1"></textarea>
  <button id="send-btn">Send</button>
</div>

<script>
const chatArea   = document.getElementById("chat-area");
const input      = document.getElementById("message-input");
const sendBtn    = document.getElementById("send-btn");
const projectSel = document.getElementById("project");

let sessionId = "ui-" + Math.random().toString(36).slice(2, 10);

async function loadProjects() {
  try {
    const res = await fetch("/projects");
    const data = await res.json();
    for (const name of Object.keys(data)) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name;
      projectSel.appendChild(opt);
    }
  } catch (e) {
    console.error("Failed to load projects:", e);
  }
}

function addMessage(role, content) {
  const empty = chatArea.querySelector(".empty-state");
  if (empty) empty.remove();

  const div = document.createElement("div");
  div.className = `message ${role}`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;

  if (content) div.textContent = content;
  return div;
}

function parseStreamOutput(raw) {
  let answer = raw;
  let sources = "";
  let nodeTrace = "";
  let validationText = "";

  const sourcesIdx = raw.indexOf("\n\nSources: ");
  const traceIdx = raw.indexOf("\n[nodes: ");
  const validatingIdx = raw.indexOf("\n\n⏳ Validating...");

  let endOfAnswer = raw.length;
  if (validatingIdx >= 0) endOfAnswer = Math.min(endOfAnswer, validatingIdx);
  if (sourcesIdx >= 0) endOfAnswer = Math.min(endOfAnswer, sourcesIdx);
  if (traceIdx >= 0) endOfAnswer = Math.min(endOfAnswer, traceIdx);

  answer = raw.slice(0, endOfAnswer);

  if (sourcesIdx >= 0) {
    const srcEnd = traceIdx >= 0 ? traceIdx : raw.length;
    sources = raw.slice(sourcesIdx + 12, srcEnd).trim();
  }

  if (traceIdx >= 0) {
    nodeTrace = raw.slice(traceIdx + 1).replace("[nodes: ", "").replace("]", "").trim();
  }

  if (validatingIdx >= 0) {
    const valStr = raw.slice(validatingIdx);
    if (valStr.includes("✓ Re-validated")) validationText = "re-validated";
    else if (valStr.includes("✓ Validated")) validationText = "validated";
    else if (valStr.includes("⚠")) validationText = "unverified";
    else validationText = "validating";
  }

  return { answer, sources, nodeTrace, validationText };
}

function renderAssistantMessage(div, raw) {
  const { answer, sources, nodeTrace, validationText } = parseStreamOutput(raw);

  div.textContent = "";

  const answerSpan = document.createElement("span");
  answerSpan.textContent = answer;
  div.appendChild(answerSpan);

  if (validationText) {
    const badge = document.createElement("div");
    badge.className = "validation-badge";
    if (validationText === "validated") {
      badge.classList.add("valid");
      badge.textContent = "✓ Validated";
    } else if (validationText === "re-validated") {
      badge.classList.add("revalidated");
      badge.textContent = "✓ Re-validated";
    } else if (validationText === "unverified") {
      badge.classList.add("unverified");
      badge.textContent = "⚠ Could not verify citations";
    } else {
      badge.classList.add("validating");
      badge.innerHTML = '<span class="typing-indicator">⏳ Validating...</span>';
    }
    div.appendChild(badge);
  }

  if (sources) {
    const srcDiv = document.createElement("div");
    srcDiv.className = "sources";
    srcDiv.textContent = "Sources: " + sources;
    div.appendChild(srcDiv);
  }

  if (nodeTrace) {
    const traceDiv = document.createElement("div");
    traceDiv.className = "node-trace";
    traceDiv.textContent = nodeTrace;
    div.appendChild(traceDiv);
  }
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;

  addMessage("user", text);

  const assistantDiv = addMessage("assistant", "");
  assistantDiv.innerHTML = '<span class="typing-indicator">Thinking...</span>';

  const body = {
    session_id: sessionId,
    message: text,
  };
  const proj = projectSel.value;
  if (proj) body.project_name = proj;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let accumulated = "";
    let firstChunk = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      accumulated += decoder.decode(value, { stream: true });

      if (firstChunk) {
        assistantDiv.textContent = "";
        firstChunk = false;
      }

      renderAssistantMessage(assistantDiv, accumulated);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    renderAssistantMessage(assistantDiv, accumulated);

  } catch (e) {
    assistantDiv.textContent = "Error: " + e.message;
  }

  sendBtn.disabled = false;
  input.focus();
}

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 120) + "px";
});

loadProjects();
input.focus();
</script>

</body>
</html>
